# In git the image points at a moving TAG; the PUBLISHED chart pins a DIGEST,
# rewritten by ci-release at package time (D65).
image:
  repository: ghcr.io/yadgarhq/iam
  tag: latest

# At least two, always (D55) — and here it is load-bearing rather than
# ceremonial: D23's client-side balancing cannot be exercised by one replica of
# this service talking to one replica of iam-db.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# The HEADLESS Service of the -db twin (D23). Resolving this name yields every
# ready pod address rather than one virtual IP, which is what makes client-side
# balancing possible at all.
iamDb:
  host: iam-db
  port: 50051

  # The TRANSPORT to that twin, and the worst cleartext hop in the system: every
  # password verification, every credential resolution and every encrypted
  # personal-data field (D72) crosses it. On a flat pod network that is readable
  # by anyone on the network.
  #
  # PATHS AND A FLAG, NEVER AN ISSUER-SPECIFIC RESOURCE (D80) — the same shape
  # `enrolment.caSecret` below already uses, for the same reason. The chart names
  # a Secret and a key inside it, and the binary is handed a file path. In the
  # reference deployment cert-manager writes that Secret; on EKS a Secret
  # assembled by hand produces something neither the chart nor the binary can
  # tell apart. Nothing here requires a CRD, an issuer or a mesh.
  tls:
    # OFF, and it stays off until the servers can answer. **iam-db does not serve
    # TLS yet**, so turning this on today breaks the hop rather than securing it.
    # The code ships first and the cut-over is a separate, revertible change —
    # the same discipline the attestation cut-over used.
    #
    # THERE IS NO SILENT MIDDLE STATE. `true` with no usable bundle fails at boot
    # naming the file; it never falls back to cleartext, and it never falls back
    # to the platform trust store. `false` with a bundle still configured is the
    # reverted state, and iam logs a warning saying the hop is in cleartext so
    # nobody has to infer it.
    enabled: false
    # The Secret holding the authority that signed iam-db's certificate.
    #
    # A SECRET, THOUGH A CA IS PUBLIC — because that is where an issuer actually
    # writes it. Reading it here claims no confidentiality the certificate does
    # not have.
    #
    # NOT A PEM PASTED INTO THIS FILE. The authority rotates, and a copy in git
    # is correct only until the rotation nobody remembered to follow.
    caSecret: iam-db-tls
    # The key inside that Secret which holds the bundle, mounted as `ca.pem`.
    # Named rather than assumed: `ca.crt` is what cert-manager calls it, and a
    # Secret assembled by hand for a deployment cert-manager does not run in is
    # free to call it something else.
    caSecretKey: ca.crt
    # The name iam-db's certificate is verified against, when it is NOT
    # `iamDb.host`.
    #
    # EMPTY IS THE RIGHT ANSWER ALMOST ALWAYS. Client-side balancing dials pod
    # ADDRESSES, and a certificate names a HOST — so leaving this empty verifies
    # against the Service name above, which is what lets one certificate issued
    # for the Service work across every pod behind it. Set it only for a
    # certificate issued for something else, such as a per-namespace FQDN.
    domain: ""

# Mounted at /var/run/secrets/iam-keys (D72): the AES-GCM and HMAC keys iam uses
# to encrypt personal data at rest and to compute blind indexes, held in a
# Secret and never in the database — so a stolen backup decrypts nothing.
keysSecret: iam-keys

# D68: scale on CONCURRENCY, not CPU. A -db waits on MariaDB and a logic service
# waits on its -db, so both saturate at low CPU — a CPU-driven HPA stays quiet
# exactly when the system is in trouble.
#
# The signal is call RATE per replica, read from D67's metrics. Rate rather than
# a gauge because nothing tracks in-flight requests yet: rate is what the
# instrumentation actually exposes today, and pretending otherwise would give a
# scaler that reads nothing. Stated here rather than silently substituted.
autoscaling:
  # D80: KEDA's CRD is not something every adopter has installed. `false` here
  # is the chart's own default so `helm template`/`helm install` succeed on a
  # bare cluster; the reference deployment in yadgarhq/deploy sets this true
  # (autoscaling.enabled=true in its values for this chart) to get the scaling
  # behaviour described above.
  enabled: false
  minReplicas: 2
  # At least two, always (D55) — the floor is a correctness property, not a
  # tuning knob: one replica makes a class of defect unreachable.
  maxReplicas: 6
  # Calls per second per replica before adding one.
  threshold: "10"
  prometheusAddress: http://prometheus-server.observability.svc.cluster.local

# The broker (D22), for publishing D72's cache invalidation. NOT a startup
# dependency: a broker outage must not become an authentication outage, so iam
# starts without it, warns loudly, and revocations are honoured late until it
# returns.
nats:
  url: nats://nats:4222

login:
  # The shortest time Login may answer in, in milliseconds. It floors the WHOLE
  # call, success and failure alike, so the response time stops being a function
  # of how much Argon2 work the stored hash cost — which is what otherwise tells
  # an attacker which usernames exist.
  #
  # 250 IS A FLOOR, NOT A TARGET, AND IT CAME FROM A MEASUREMENT ON DEV HARDWARE.
  # 25 samples per class through the live edge: a matched-cost login at 27-29ms
  # median, and a row stored at m=65536,t=3,p=1 at 98ms median and 136ms worst.
  # Re-measure here and raise this if the slowest legitimate login on THIS
  # cluster approaches it — a floor set under the true worst case does not close
  # the leak, it clips it. iam logs a WARN naming both durations whenever a login
  # exceeds the floor, which is the signal that this number is too low.
  #
  # Lowering it is a security change, not a latency optimisation.
  responseFloorMs: 250

redeemEnrolment:
  # The same control for RedeemEnrolment, and DELIBERATELY A SEPARATE NUMBER.
  #
  # That RPC is unauthenticated by construction — the enrolment secret is the
  # whole authenticator — and its three refusals (unknown, spent, expired) are
  # decided inside iam-db. A timing difference between them therefore arises in
  # ANOTHER PROCESS, which no amount of constant work inside iam can equalise;
  # only a floor over the whole handler covers it.
  #
  # 750 rather than Login's 250 because a redemption legitimately costs more: it
  # HASHES the chosen password and then VERIFIES it against what the store holds,
  # two Argon2id operations against Login's one, plus a further round trip.
  # Sharing Login's floor would put every successful redemption over it, so iam
  # would warn on every call — an alert that always fires is an alert on nothing,
  # and it would drown the Login warning that means something.
  #
  # Measured on dev hardware, like Login's. Re-measure here, and raise it if the
  # slowest legitimate redemption on THIS cluster approaches it.
  responseFloorMs: 750

# What iam puts into every enrolment token it mints (D73). An admin assembles
# neither value and so cannot get either wrong — which puts the whole burden of
# holding correct ones here.
enrolment:
  # The gateway address a person's first client connects to.
  #
  # EMPTY HERE AND MUST BE SET PER DEPLOYMENT. There is no default that could be
  # right: this is the address a stranger's laptop dials, and the chart cannot
  # know it.
  #
  # LEAVING IT EMPTY DISABLES IssueEnrolment AND NOTHING ELSE. iam warns at boot
  # and the RPC refuses with FAILED_PRECONDITION naming this variable; Login and
  # ResolveCredential are unaffected. It is deliberately NOT a boot failure —
  # iam is the authentication plane, and a CrashLoopBackOff here would take the
  # estate's credential resolution down over one administrative value. What the
  # refusal protects is the contract's rule that a minted token never carries an
  # empty gateway: the field has no presence, so such a token would be
  # structurally valid and point at nothing, and its failure would surface on
  # that stranger's machine as an undiagnosable connection error.
  gateway: "https://gateway.yadgar.internal:18443"

  # The Secret holding the root CA the token carries.
  #
  # EMPTY MEANS SYSTEM TRUST, which is a legitimate deployment rather than a
  # missing value: the mechanism exists for development and private deployments,
  # and a publicly-trusted certificate needs no anchor handed over. Absent and
  # empty are different instructions to a client, and iam refuses a CA file that
  # is present and empty for exactly that reason.
  #
  # THE VALUE IS THE GATEWAY'S OWN CERTIFICATE SECRET, and that is the design
  # rather than a convenience. cert-manager writes `tls.crt` and `ca.crt` into
  # this one Secret in a single issuance, so the anchor named here is BY
  # CONSTRUCTION the anchor for the certificate the gateway IS SERVING. There is
  # no copy to refresh and no second object to keep in step, so the two cannot
  # drift apart.
  #
  # NOT THE ISSUER'S OWN SECRET. `yadgar-dev-ca` holds the root itself, but it
  # can run AHEAD of the leaf — a new root published before the gateway's
  # certificate has been reissued — and a token minted from it in that window
  # carries a root that does not sign what the gateway serves. It also lives in
  # cert-manager's namespace, which this pod cannot mount from at all.
  #
  # NOT A PEM PASTED INTO THIS FILE. The root rotates. A copy in git is correct
  # only until the rotation nobody remembered to follow, and the failure then
  # lands on a stranger's first connection rather than on the person who moved
  # the CA.
  #
  # A SECRET, THOUGH A ROOT CA IS PUBLIC. Reading it here claims no
  # confidentiality the certificate does not have; it references the artifact
  # where cert-manager ACTUALLY WRITES the CA, and cert-manager writes Secrets.
  # The mount selects one key alone, so the gateway's private key — which shares
  # this Secret — never enters the pod.
  caSecret: gateway-tls

  # The key inside that Secret which holds the CA, mounted as `ca.pem`.
  #
  # `ca.crt` is cert-manager's name for the certificate that signed the leaf.
  # Named here rather than assumed, because a Secret assembled by hand for a
  # deployment cert-manager does not run in is free to call it something else.
  caSecretKey: ca.crt
