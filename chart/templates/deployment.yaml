apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # OMITTED ENTIRELY WHEN KEDA OWNS THE COUNT, and that guard is the whole point
  # of the condition. KEDA drives a ScaledObject through an HPA, which writes
  # `spec.replicas` on this Deployment; Argo runs with `selfHeal: true` and no
  # `ignoreDifferences` for this field, so a rendered `replicas:` is a value Argo
  # keeps restoring and the autoscaler keeps overwriting. That is not a snap on
  # each upgrade — it is a CONTINUOUS revert loop, in which a scale-up is undone
  # within a sync interval and the load that caused it is served by
  # `replicaCount` pods.
  #
  # Rendering nothing hands the field to the HPA, which is what `minReplicas`
  # exists to floor. `replicaCount` still applies to every deployment that has
  # not enabled autoscaling, which is the chart's own default (D80).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.rollingUpdate }}
  # THE ROLL'S SHAPE, WRITTEN OUT BECAUSE THE DEFAULT IS COUNT-DEPENDENT
  # (ledger 691). Kubernetes defaults both `maxUnavailable` and `maxSurge` to
  # 25%, and it stores the PERCENTAGE rather than a resolved integer: the
  # controller resolves it against the LIVE replica count at every roll,
  # rounding `maxUnavailable` down and `maxSurge` up.
  #
  # AT THIS CHART'S OWN DEFAULT THIS CHANGES NOTHING, and the diff must not be
  # read as if it did. 25% of `replicaCount: 2` is 0.5, which is already 0 down
  # and 1 up. Checked against the live objects rather than assumed: every yadgar
  # Deployment in the reference cluster stores `25%`/`25%` today and therefore
  # already rolls at 0/1.
  #
  # WHAT IT CHANGES IS THAT THE GUARANTEE SURVIVES A COUNT CHANGE. `autoscaling`
  # hands the count to KEDA up to `maxReplicas`, and at 6 that same 25% resolves
  # to `maxUnavailable: 1` — a roll under load then runs a replica short,
  # silently, because nobody ever wrote a number. This is ledger 606's argument
  # about `failureThreshold` applied to the other inherited default in this
  # file: the defect was never the value, it was that `git grep strategy` could
  # not find it.
  #
  # THE SURGE POD IS SCHEDULABLE. It is three pods against two schedulable nodes
  # in the reference cluster — three kind nodes, the control plane carrying
  # `node-role.kubernetes.io/control-plane:NoSchedule` — at a 50m CPU request,
  # and `topologySpreadConstraints` below is `ScheduleAnyway` precisely so that
  # third pod is never the one that stalls the roll.
  #
  # `rollingUpdate: {}` in an operator's values renders nothing here and returns
  # the field to the count-dependent default described above.
  strategy:
    type: RollingUpdate
    rollingUpdate: {{- toYaml . | nindent 6 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # ITS OWN, rather than the namespace's `default` (ledger 511). Every pod
      # gets a ServiceAccount whether or not anybody names one, so the choice is
      # never "an identity or none" — it is "an identity this workload owns, or
      # the one every unnamed workload in the namespace shares". A shared identity
      # cannot be granted a permission without granting it to all of them, and
      # this is the authentication plane: it is the last workload in the estate
      # that should share an identity with anything.
      serviceAccountName: {{ .Chart.Name }}
      # NO KUBERNETES API TOKEN IN THE POD. `iam` never calls the API server: it
      # serves gRPC, dials `iam-db`, and publishes to the broker. Mounting a token
      # it does not use hands a credential to anything that reaches the
      # filesystem — and this pod also holds the AES-GCM and HMAC keys of D72, so
      # it is the one whose filesystem is worth reaching. Set here as well as on
      # the ServiceAccount because the pod spec wins, and the pod spec is what a
      # reader of this file sees.
      automountServiceAccountToken: false
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.terminationGracePeriodSeconds }}
      # 35 = 5 + 25 + 5, AND EVERY TERM IS SOMEBODY ELSE'S NUMBER (ledger 690).
      # This is ONE budget covering BOTH halves of a pod's death, which is what
      # makes the arithmetic non-obvious: kubelet runs the `preStop` handler
      # first and sends SIGTERM only afterwards, and the clock does not restart
      # in between. So this must cover the sleep below PLUS the drain after it.
      #
      #    5  the `preStop` sleep on the container below.
      #   25  `yadgar_lifecycle::DRAIN_BUDGET` (lifecycle/src/drain.rs) — the
      #       longest `drain_within` lets the serving future run once shutdown
      #       has been asked for. A constant, deliberately, and not a number
      #       this chart is allowed to set.
      #    5  the slack that same constant's docstring reserves "to log and
      #       exit".
      #
      # WHY NOT LEAVE IT AT THE INHERITED 30. 30 was exactly enough while nothing
      # ran before SIGTERM: 30 - 25 is that 5s of slack and not one second more.
      # A 5s `preStop` spends the whole of it and leaves a 25s budget inside a
      # 25s window, so the first drain that actually used its budget would meet
      # SIGKILL at the instant it overran — the one outcome `DRAIN_BUDGET`
      # exists to make unreachable. Adding the hook without moving this number
      # would have been strictly worse than adding neither.
      #
      # THE RELATIONSHIP IS NOW ASSERTABLE, WHICH IT WAS NOT. `DRAIN_BUDGET`'s
      # docstring says "no chart in this estate sets or exposes it, so there is
      # no rendered value to assert against and the relationship is stated here
      # rather than faked as a test". This line is that rendered value. The rule
      # that docstring states still holds and points the other way: "a
      # deployment that lowers the grace period below 25s must lower this with
      # it" — 35 does not lower it.
      #
      # `0` RENDERS NOTHING rather than rendering `0`, and the asymmetry is
      # deliberate: a literal 0 is an immediate SIGKILL with no drain at all.
      # Set 0 to return the field to kubelet's 30s default. There is no way to
      # spell "kill instantly" through this chart.
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      # HOSTNAME IS THE ONLY AXIS THERE IS, AND `ScheduleAnyway` IS THE ONLY SAFE
      # STRENGTH (ledger 691). Measured on the reference cluster rather than
      # assumed: three kind nodes, not one of them carrying a
      # `topology.kubernetes.io/zone` or `/region` label, and the control plane
      # tainted `node-role.kubernetes.io/control-plane:NoSchedule` — two
      # schedulable nodes for two replicas.
      #
      # `DoNotSchedule` WOULD HANG EVERY ROLL, and that is the whole reason this
      # says otherwise. `maxSurge: 1` puts three pods on those two nodes for the
      # length of a roll, which is a skew of 2 against `maxSkew: 1`; a required
      # constraint leaves the surge pod Pending, and with `maxUnavailable: 0` the
      # rollout then neither proceeds nor fails. It hangs, with no error — D68's
      # failure mode wearing a different field's name.
      #
      # THE SELECTOR IS THIS TEMPLATE'S, NEVER THE OPERATOR'S, which is why only
      # the three scalars live in `values.yaml`. It is `app: {{ .Chart.Name }}`
      # — the label this Deployment actually sets, and the one the
      # PodDisruptionBudget already selects on. A `labelSelector` that matches no
      # pod is a field that does nothing for the rest of the chart's life, and
      # neither `helm template` nor `helm lint --strict` will say a word about
      # it.
      #
      # NO `affinity` BESIDE THIS, DELIBERATELY. A preferred `podAntiAffinity` on
      # the same label and the same topology key is this same control spelled a
      # second way, and two knobs for one decision is how they come to disagree.
      # Ledger 691's `affinity` is declined rather than added.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ .Chart.Name }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50052
          env:
            # THE TWO LISTENERS, STATED HERE because the binary no longer holds a
            # default for either (ADR-0569): a knob has one source, and an absent
            # or empty value refuses the boot naming the variable. These were the
            # last two compiled-in defaults in iam, so rendering them is what
            # keeps the pod bootable rather than what makes the ports tunable.
            #
            # LITERALS, not values.yaml keys. There is no operator question these
            # answer — the grpc port is fixed by `containerPort: 50052` a few
            # lines above and by the Service that targets it, and the metrics port
            # by what the scrape config expects. A values key would invite the two
            # to disagree.
            - name: LISTEN
              value: "0.0.0.0:50052"
            - name: METRICS_LISTEN
              value: "0.0.0.0:9090"
            {{- if .Values.tls.enabled }}
            # THE CERTIFICATE THIS SERVICE PRESENTS, not one it verifies —
            # `IAM_DB_TLS_*` below is the other direction, and the two share a
            # word. RENDERED ONLY WHEN ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and binds the plaintext
            # listener it always bound. Absence is the default, and the flag is
            # the whole of the lever.
            - name: LISTEN_TLS_ENABLED
              value: "1"
            # PATHS, never an issuer-specific resource (D80). cert-manager writes
            # these files in the reference deployment and a hand-assembled Secret
            # writes them anywhere else; neither the chart nor the binary can
            # tell the difference, which is the point.
            - name: LISTEN_TLS_CERT_FILE
              value: /var/run/secrets/iam-tls/tls.pem
            - name: LISTEN_TLS_KEY_FILE
              value: /var/run/secrets/iam-tls/tls-key.pem
            {{- end }}
            - name: IAM_DB_HOST
              value: {{ .Values.iamDb.host | quote }}
            - name: IAM_DB_PORT
              value: {{ .Values.iamDb.port | quote }}
            {{- if .Values.iamDb.tls.enabled }}
            # RENDERED ONLY WHEN TLS IS ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and takes the cleartext
            # path it always took. Absence is the default, and the flag is the
            # whole of the lever.
            - name: IAM_DB_TLS_ENABLED
              value: "1"
            # A PATH, never an issuer-specific resource (D80) — the same shape
            # ENROLMENT_CA_PEM_FILE below already uses. cert-manager writes this
            # file in the reference deployment and a hand-assembled Secret writes
            # it anywhere else; neither the chart nor the binary can tell the
            # difference, which is the point.
            - name: IAM_DB_TLS_CA_FILE
              value: /var/run/config/iam-db-ca/ca.pem
            {{- if .Values.iamDb.tls.clientCertSecret }}
            # WHO THIS SERVICE SAYS IT IS ON THAT HOP — mutual TLS (ADR-0516),
            # and a THIRD direction beside the two above. LISTEN_TLS_* is what
            # iam serves; IAM_DB_TLS_CA_FILE is how iam verifies iam-db; these
            # two are what iam PRESENTS so iam-db can authenticate the caller.
            #
            # RENDERED ONLY WHEN A SECRET IS NAMED, and `iamDb.tls.clientCertSecret`
            # is EMPTY by default. So turning `iamDb.tls.enabled` on encrypts the
            # hop and presents no identity, exactly as before; naming the Secret
            # is a second, separately revertible lever. The binary refuses one
            # path without the other, so the two are rendered together or not at
            # all.
            #
            # PATHS, never an issuer-specific resource (D80), for the reason
            # given on IAM_DB_TLS_CA_FILE above.
            - name: IAM_DB_TLS_CLIENT_CERT_FILE
              value: /var/run/secrets/iam-client-tls/client.pem
            - name: IAM_DB_TLS_CLIENT_KEY_FILE
              value: /var/run/secrets/iam-client-tls/client-key.pem
            {{- end }}
            {{- if .Values.iamDb.tls.domain }}
            # Only when the certificate names something other than the Service.
            # Unset means "verify against iamDb.host", which is what makes a
            # certificate issued for the Service name work while the balancer
            # dials pod addresses.
            - name: IAM_DB_TLS_DOMAIN
              value: {{ .Values.iamDb.tls.domain | quote }}
            {{- end }}
            {{- end }}
            # The crypto keys (D72). YADGAR_KEYS_DIR names where Keys::from_env
            # reads them; the Secret itself is mounted below.
            - name: YADGAR_KEYS_DIR
              value: /var/run/secrets/iam-keys
            # The broker (D22), for publishing D72's cache invalidation. Absent
            # or unreachable is survivable and loudly logged: a broker outage
            # must not become an authentication outage, and the cache TTL is the
            # backstop for exactly that window.
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- if .Values.nats.passwordSecret }}
            # RENDERED ONLY WHEN THE BROKER ASKS FOR A CREDENTIAL, so a
            # deployment that has not cut over sends the binary nothing at all
            # and connects exactly as it always did. Absence is the default and
            # the Secret is the whole of the lever — the same shape
            # `enrolment.caSecret` above already uses.
            #
            # BOTH, OR NEITHER. The broker's authorization block names an account
            # and a password together, so iam refuses to start with either one
            # alone, in BOTH directions.
            #
            # WHICH MAKES THE `if` ABOVE LOAD-BEARING rather than tidy: it renders
            # this variable and the password path TOGETHER, so an adopter who
            # clears `nats.passwordSecret` drops both and boots with no credential
            # — the supported state — even though `nats.user` still carries its
            # default. Rendering this one on its own would refuse the boot.
            #
            # `required` here rather than a bare lookup: an override that nulls
            # the user would otherwise render an empty string, and the failure
            # would be a CrashLoop three layers from its cause.
            - name: NATS_USER
              value: {{ required "nats.user names the broker account iam authenticates as and must be set whenever nats.passwordSecret is; see the chart's values.yaml" .Values.nats.user | quote }}
            # A PATH, never the value (D80). A password in the environment is a
            # password in `kubectl describe pod`; a file is readable only inside
            # the container.
            #
            # THERE IS NO SILENT MIDDLE STATE. A path that names no readable,
            # non-empty file fails the pod at boot naming the path — iam never
            # falls back to an unauthenticated broker connection. A broker that
            # REFUSES the credential is survivable, because iam is the
            # authentication plane and a broker fault must not become an
            # authentication outage; it is logged as a deployment error rather
            # than as an outage, and D72's TTL becomes the backstop meanwhile.
            - name: NATS_PASSWORD_FILE
              value: /var/run/secrets/nats/password
            {{- end }}
            # The shortest time Login may answer in. A security control rather
            # than a tuning knob: it is what stops the response time from
            # reporting how much Argon2 work a row cost, and so which usernames
            # exist. Templated rather than left to the binary's default because
            # the right value is a MEASUREMENT of the slowest legitimate login on
            # THIS cluster, and the default was measured on dev hardware. iam
            # warns when a login exceeds it, which is the signal to raise it.
            #
            # `required` rather than a bare lookup or a `| default 250`. A values
            # override that nulls `login` renders an EMPTY string here, and the
            # binary refuses that boot naming the variable (ADR-0569). `required`
            # catches it one layer earlier still, as a TEMPLATE-time error naming
            # the value, so nobody has to read a CrashLoop to learn which values
            # key was nulled. NOT `| default`, which would hand back a floor
            # nobody chose, and a security control configured by accident is the
            # failure this whole change is about.
            - name: LOGIN_RESPONSE_FLOOR_MS
              value: {{ required "login.responseFloorMs is the Login response-time floor in milliseconds and must be set; see the chart's values.yaml" .Values.login.responseFloorMs | quote }}
            # The same control for RedeemEnrolment, and its own number. That RPC
            # is unauthenticated and its three refusals are decided inside
            # iam-db, so the difference a floor hides here arises in another
            # process and constant work in iam cannot reach it. `required` for
            # the reason above: a floor nobody chose is a security control
            # configured by accident.
            - name: REDEEM_RESPONSE_FLOOR_MS
              value: {{ required "redeemEnrolment.responseFloorMs is the RedeemEnrolment response-time floor in milliseconds and must be set; see the chart's values.yaml" .Values.redeemEnrolment.responseFloorMs | quote }}
            # The gateway address every enrolment token carries (D73).
            #
            # NOT `required`, and NOT a boot failure either. No default can know
            # a deployment's EXTERNAL address, so the chart cannot supply one —
            # and iam must not CrashLoopBackOff over it, because iam is the
            # authentication plane: stopping the process would halt every
            # dependent service's credential resolution once the gateway's 300s
            # cache expired, over a value belonging to one administrative RPC.
            #
            # Unset means IssueEnrolment refuses with FAILED_PRECONDITION naming
            # this variable, and iam WARNs about it at boot. The contract's rule
            # — never mint a token carrying an empty gateway — is kept by the
            # refusal, without an availability cost.
            - name: ENROLMENT_GATEWAY
              value: {{ .Values.enrolment.gateway | quote }}
            {{- if .Values.enrolment.caSecret }}
            # Set ONLY when a CA is configured. Absence is the whole of "use
            # system trust", so an empty value here would be a token assembled
            # wrong rather than a deployment without a CA — and iam refuses that.
            - name: ENROLMENT_CA_PEM_FILE
              value: /var/run/config/iam-ca/ca.pem
            {{- end }}
          # This service does NOT wait for iam-db before listening, so the port
          # opening means "process up", not "dependency healthy" — deliberately.
          # Blocking startup on a -db that is still migrating would turn one
          # module's slow boot into a cascading outage, and a pod stuck in
          # startup is one D68's autoscaler cannot help. A request that cannot
          # reach the store fails with UNAVAILABLE, which is recoverable.
          #
          # The crypto keys are different: their absence fails the process at
          # boot (D72), before this probe ever gets a chance to run.
          {{- with .Values.preStopSleepSeconds }}
          # THE SLEEP IS FOR THE WITHDRAWAL, NOT FOR THE DRAIN (ledger 690).
          # Deleting a pod fans out to two consumers that do not wait for each
          # other: kubelet, which begins killing the container, and the
          # EndpointSlice controller, whose removal then has to reach everything
          # that routes here. Nothing orders those two. With no `preStop`,
          # SIGTERM can win, and the drain below — which is careful, bounded and
          # correct — then drains a listener that callers are still being sent
          # to. What is lost is every request dispatched INTO that window, and no
          # amount of drain budget helps with those: they arrive after the
          # decision to stop and before anyone was told.
          #
          # THE PATH HERE IS EVERY CALLER'S OWN BALANCER, which is the longer
          # of the two shapes this estate has. This Service is headless
          # (`clusterIP: None` in `service.yaml`) so callers resolve the pod
          # addresses and balance across them client-side through `yadgar-dial`.
          # The removal therefore has to reach each CALLER's endpoint watch and
          # then its balancer, rather than one kube-proxy per node — more hops
          # than a virtual IP and less bounded, which is the case 5s is sized
          # for.
          #
          # THIS IS NOT WHAT THE READINESS PROBE COVERS, and the probe's own
          # stanza below says so: a pod being ROLLED never pays the probe window,
          # because the EndpointSlice controller drops a pod carrying a
          # `deletionTimestamp` with no probe involved. That probe governs the
          # self-initiated rotation drain of ADR-0523, where there is no
          # `deletionTimestamp` for anything to see. This governs the deletion
          # path. The two do not overlap, and neither substitutes for the other.
          #
          # `sleep`, NOT AN `exec` OF /bin/sleep — AND THE IMAGE LEAVES NO
          # CHOICE. `Containerfile` ships this binary on
          # `ghcr.io/yadgarhq/runtime`, which is distroless/static (D63): no
          # shell, no `sleep` binary. An `exec` handler would fail, kubelet would
          # log the failure and proceed straight to SIGTERM, and this chart would
          # look hardened while doing nothing whatsoever. The `sleep` action is
          # the API server's own and needs neither shell nor binary. It wants a
          # control plane at v1.30 or newer; verified present on the reference
          # cluster's v1.36 with `kubectl explain
          # pod.spec.containers.lifecycle.preStop.sleep`, and an older control
          # plane would drop the field rather than refuse it.
          #
          # 5s IS PAID ON EVERY POD DEATH, which is the cost worth naming rather
          # than burying. It lengthens a rolling update by 5s per batch and a
          # node drain by 5s per pod, and it is spent INSIDE
          # `terminationGracePeriodSeconds` above rather than added to it. `0`
          # renders no `lifecycle` block at all.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            # WITHDRAWAL IS `failureThreshold` x `periodSeconds`, AND BOTH ARE
            # WRITTEN HERE (ledger 606). Only `periodSeconds` was ever spelled;
            # `failureThreshold` was kubelet's inherited 3, so the 15s this pod
            # stayed in the Service after it stopped listening was a number
            # nobody chose and `git grep failureThreshold` could not find. 2 x 2
            # makes it 4s, and makes it findable.
            #
            # THE CASE THIS COSTS IS NARROW, and naming it is what keeps the
            # numbers honest. A pod being ROLLED does not pay it: the
            # EndpointSlice controller drops a pod carrying a `deletionTimestamp`
            # from the ready set at deletion, with no probe involved. A CRASHED
            # container does not pay it either: kubelet reports a container that
            # is not running as not ready on the next status sync, ahead of the
            # prober. What pays it is a process that is ALIVE and has stopped
            # listening, which is the self-initiated rotation drain of ADR-0523
            # exactly: `rotate` ends the serve, the listener closes, and the
            # process stays up for up to `DRAIN_BUDGET` with no
            # `deletionTimestamp` for either fast path to see. In that window
            # this probe is the ONLY thing that withdraws this pod.
            #
            # `timeoutSeconds` IS SPELLED BECAUSE `periodSeconds` DEPENDS ON IT.
            # A prober worker ticks once per period and a probe may run for the
            # whole timeout, so the product above is the real window only while
            # the timeout is the smaller number. Raising `timeoutSeconds` past
            # `periodSeconds` stretches the withdrawal silently, and that is the
            # defect this stanza exists to stop repeating.
            #
            # WHY NOT TIGHTER, AND WHY NOT LOOSER. `failureThreshold: 1` lets one
            # dropped SYN withdraw a healthy pod, and against `replicaCount: 2`
            # that is half this service for the length of a transient. Note it
            # would be a WITHDRAWAL, not an eviction: a PodDisruptionBudget
            # governs the Eviction API and cannot act on a readiness-driven
            # EndpointSlice change, so it is no backstop here.
            #
            # KEEPING 3 WAS THE REAL ALTERNATIVE and it is not free either. At
            # `periodSeconds: 2` a threshold of 3 gives 6s — nine of the eleven
            # seconds cut, while keeping the whole inherited transient budget.
            # Dropping to 2 spends a third of that budget for the last 2s. It is
            # taken because no chart here sets `affinity`, `topologySpread` or a
            # `strategy`, so both replicas can co-locate and any node-local fault
            # is already a whole-service fault; what 3 buys back is roughly 3s of
            # recovery tail after the fault clears, against 11s off every
            # rotation drain. `periodSeconds: 1`
            # buys the same 4s at threshold 4, but it puts the period ON the
            # timeout, so the arithmetic stops holding the moment a probe has to
            # wait rather than being refused. There is no boot cost either way:
            # failing readiness never kills a pod, and THIS SERVICE OWNS NO
            # ENGINE — it reports Ready as soon as it is listening, and boot to
            # listening is sub-second, so the pre-listen failures are a fraction
            # of one period. D69's probe-migrate-listen gate is NOT in front of
            # this port; it lives in the `-db` services, and an earlier revision
            # of this comment claimed it here.
            #
            # WHAT THIS DOES NOT FIX: a wedged process that keeps its socket open
            # answers a `tcpSocket` probe at every threshold. The root fix for
            # the drain window is the process reporting not-ready BEFORE it
            # closes the listener; this is chart-side mitigation for a
            # binary-side gap, and it is filed as such.
            #
            # THIS SERVICE IS HEADLESS, so the withdrawal is NOT kube-proxy's,
            # and an earlier revision of this paragraph said it was. Corrected
            # while adding the `preStop` hook above, because that hook is sized
            # against this path and two contradicting accounts of it in one file
            # is worse than either. `service.yaml` sets `clusterIP: None` and
            # callers balance across the pod addresses client-side through
            # `yadgar-dial`, so the EndpointSlice write has to reach each
            # CALLER's own watch and balancer. The probe window above is the
            # start of the delay here, not the whole of it. A virtual IP is
            # `gateway`'s shape, and only `gateway`'s.
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: keys
              mountPath: /var/run/secrets/iam-keys
              readOnly: true
            # THE CONFIGURATION REPOSITORY'S TWO CONFIGMAPS (ADR-0569, ADR-0570,
            # step 2a): the knobs every service reads, and this service's own —
            # empty today, mounted anyway so it is ready the day it is not.
            #
            # DIRECTORIES, NEVER `subPath`. A subPath mount is copied once at
            # container start and kubelet never updates it, so the file would be
            # frozen for the life of the pod while the ConfigMap moved underneath
            # it — the rotation watcher would see nothing and an edited knob
            # would silently never take effect.
            #
            # NO `optional: true`, unlike every Secret mount below. The default,
            # `false`, is what makes kubelet refuse to start this pod at all
            # while `shared` or `iam` is absent — `ContainerCreating` naming the
            # missing ConfigMap — rather than starting it with an empty
            # directory the binary would then refuse to read from anyway
            # (`ScheduleError::Absent`).
            #
            # **`iam` IS MOUNTED, AND TODAY IT IS NEITHER READ NOR WATCHED.**
            # `yadgar-lifecycle`'s `Configuration::under(root)` yields exactly one
            # path, `root/shared/shared.yaml`; the crate has no API for a
            # per-service document, so `config-iam` is in no process's ADR-0523
            # watch set. Two things follow and both are deliberate. The
            # `optional: false` reasoning above is true of `shared` and NOT of
            # this one — an absent `iam` ConfigMap blocks the pod for no
            # functional benefit, which is accepted so that both mounts are
            # governed by one rule rather than two. And the day this file gains
            # its first knob, Argo will sync it and kubelet will swap it and NO
            # POD WILL RESTART, so the new value never takes effect and nothing
            # reports that — the exact failure ADR-0570 names for `envFrom`,
            # reproduced through a file mount. THE MOUNT IS READY; JOINING THIS
            # DOCUMENT TO THE WATCH SET IS A FURTHER CHANGE, and it belongs in
            # the same pull request as the first `iam`-only knob.
            - name: config-shared
              mountPath: /etc/yadgar/config/shared
              readOnly: true
            - name: config-iam
              mountPath: /etc/yadgar/config/iam
              readOnly: true
            {{- if .Values.nats.passwordSecret }}
            # A DIRECTORY MOUNT, never subPath — for the reason spelled out on
            # the enrolment CA below: a subPath mount is a one-time copy kubelet
            # never refreshes, so a rotated broker password would never reach this
            # process and it would keep presenting the old one.
            - name: nats-password
              mountPath: /var/run/secrets/nats
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath — for the reason spelled out on
            # the enrolment CA below: a subPath mount is a one-time copy that
            # kubelet never refreshes, so a renewed certificate would never reach
            # this process and the listener would keep serving an expired one
            # until somebody restarted it.
            - name: serving-cert
              mountPath: /var/run/secrets/iam-tls
              readOnly: true
            {{- end }}
            {{- if .Values.iamDb.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath — for the reason spelled out on
            # the enrolment CA below: a subPath mount is a one-time copy that
            # kubelet never refreshes, so a rotated authority would never reach
            # this process.
            - name: iam-db-ca
              mountPath: /var/run/config/iam-db-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.iamDb.tls.enabled .Values.iamDb.tls.clientCertSecret }}
            # A DIRECTORY MOUNT, never subPath — and here the rule is at its most
            # expensive to break. A subPath mount is a one-time copy kubelet
            # never refreshes, so a renewed CLIENT certificate would never reach
            # this process; ADR-0516 makes that an expired leaf that STOPS the
            # hop to iam-db rather than one that merely weakens it. The watcher
            # above only works because this is a directory.
            - name: iam-db-client-cert
              mountPath: /var/run/secrets/iam-client-tls
              readOnly: true
            {{- end }}
            {{- if .Values.enrolment.caSecret }}
            # A DIRECTORY MOUNT, never subPath. A subPath mount is a one-time
            # copy that kubelet never refreshes, so the CA would freeze at
            # whatever it was when the pod started — and the propagation that
            # follows the certificate through a rotation is the entire reason
            # this reads the gateway's own Secret rather than a pasted copy.
            - name: enrolment-ca
              mountPath: /var/run/config/iam-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: keys
          secret:
            secretName: {{ .Values.keysSecret }}
        # The two ConfigMaps `yadgarhq/config` renders, same reasoning as the
        # mounts above: unconditional, a directory each, never optional.
        - name: config-shared
          configMap:
            name: shared
        - name: config-iam
          configMap:
            name: iam
        {{- if .Values.nats.passwordSecret }}
        - name: nats-password
          secret:
            secretName: {{ .Values.nats.passwordSecret }}
            # OPTIONAL, and it means what it means on the iam-db CA below rather
            # than what it means on the enrolment CA: the process MUST NOT START
            # without the password, and optional is simply which error says so. A
            # required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume; an
            # optional one mounts an empty directory, the binary finds no file at
            # NATS_PASSWORD_FILE, and it exits naming THAT PATH. Neither starts;
            # only one of them explains itself. There is no third outcome in which
            # this pod connects to the broker without a credential it was told to
            # present.
            optional: true
            # ONE KEY, renamed to the `password` the environment names above, so
            # whatever the Secret's author called it does not travel into the
            # binary's configuration.
            items:
              - key: {{ required "nats.passwordSecretKey names the key inside nats.passwordSecret that holds the broker password and must be set whenever nats.passwordSecret is; see the chart's values.yaml" .Values.nats.passwordSecretKey | quote }}
                path: password
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: serving-cert
          secret:
            secretName: {{ required "tls.certSecret holds the certificate and private key iam serves and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecret }}
            # OPTIONAL, and it means what it means on the iam-db CA above rather
            # than what it means on the enrolment CA below: the process MUST NOT
            # START without a usable certificate, and optional is simply which
            # error says so. A required mount that cannot be satisfied leaves the
            # pod in ContainerCreating with a FailedMount event about a volume;
            # an optional one mounts an empty directory, the binary finds no file
            # at LISTEN_TLS_CERT_FILE, and it exits naming THAT PATH and saying
            # that TLS was asked for so cleartext is not the answer. Neither
            # starts; only one of them explains itself.
            optional: true
            # BOTH KEYS, because a listener cannot present a certificate it has
            # no key for — the one mount in this file that is meant to carry a
            # private key, and it is this pod's own. Selecting them by name is
            # also what renames whatever the issuer called them to the paths the
            # environment names above.
            items:
              - key: {{ required "tls.certSecretKey names the key inside tls.certSecret that holds the certificate and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecretKey | quote }}
                path: tls.pem
              - key: {{ required "tls.keySecretKey names the key inside tls.certSecret that holds the private key and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.keySecretKey | quote }}
                path: tls-key.pem
        {{- end }}
        {{- if .Values.iamDb.tls.enabled }}
        - name: iam-db-ca
          secret:
            secretName: {{ required "iamDb.tls.caSecret holds the CA bundle iam-db is verified against and must be set whenever iamDb.tls.enabled is; see the chart's values.yaml" .Values.iamDb.tls.caSecret }}
            # OPTIONAL, and here it means the OPPOSITE of what it means on the
            # enrolment CA below. There it buys availability: the CA belongs to
            # one administrative RPC, so a missing Secret must not stop the
            # authentication plane. Here the process MUST NOT START without a
            # usable bundle, and optional is simply which error says so. A
            # required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume; an
            # optional one mounts an empty directory, the binary finds no file at
            # IAM_DB_TLS_CA_FILE, and it exits naming THAT PATH and saying that
            # TLS was asked for so cleartext is not the answer. Neither starts;
            # only one of them explains itself.
            optional: true
            # ONE KEY, not the whole Secret. A certificate Secret also holds a
            # PRIVATE KEY, and iam has no business being able to read iam-db's.
            # Selecting a single key is what keeps it out of the pod, and it is
            # also what renames whatever the issuer called it to the `ca.pem`
            # that IAM_DB_TLS_CA_FILE names.
            items:
              - key: {{ required "iamDb.tls.caSecretKey names the key inside iamDb.tls.caSecret that holds the CA bundle and must be set whenever iamDb.tls.enabled is; see the chart's values.yaml" .Values.iamDb.tls.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if and .Values.iamDb.tls.enabled .Values.iamDb.tls.clientCertSecret }}
        - name: iam-db-client-cert
          secret:
            secretName: {{ .Values.iamDb.tls.clientCertSecret }}
            # OPTIONAL, and it means what it means on the iam-db CA above rather
            # than what it means on the enrolment CA below: the process MUST NOT
            # START without a usable identity once one has been asked for, and
            # optional is simply which error says so. A required mount that
            # cannot be satisfied leaves the pod in ContainerCreating with a
            # FailedMount event about a volume; an optional one mounts an empty
            # directory, the binary finds no file at IAM_DB_TLS_CLIENT_CERT_FILE,
            # and `yadgar_dial::connect_tls` refuses naming THAT PATH. Neither
            # starts; only one of them explains itself. There is no third outcome
            # in which this pod dials iam-db without the identity it was told to
            # present.
            optional: true
            # BOTH KEYS, because a certificate cannot be presented without the
            # key that proves it — the second mount in this file meant to carry a
            # private key, and like the first it is this pod's OWN. Selecting
            # them by name is also what renames whatever the issuer called them
            # to the paths the environment names above.
            items:
              - key: {{ required "iamDb.tls.clientCertSecretKey names the key inside iamDb.tls.clientCertSecret that holds the client certificate and must be set whenever iamDb.tls.clientCertSecret is; see the chart's values.yaml" .Values.iamDb.tls.clientCertSecretKey | quote }}
                path: client.pem
              - key: {{ required "iamDb.tls.clientKeySecretKey names the key inside iamDb.tls.clientCertSecret that holds the client private key and must be set whenever iamDb.tls.clientCertSecret is; see the chart's values.yaml" .Values.iamDb.tls.clientKeySecretKey | quote }}
                path: client-key.pem
        {{- end }}
        {{- if .Values.enrolment.caSecret }}
        - name: enrolment-ca
          secret:
            secretName: {{ .Values.enrolment.caSecret }}
            # OPTIONAL, for the reason the readiness comment above gives. A
            # Secret that is missing must not wedge this pod in
            # ContainerCreating: iam is the authentication plane and the CA
            # belongs to ONE administrative RPC, so coupling the whole process's
            # startup to the TLS edge would trade an estate-wide outage for an
            # enrolment one. Optional mounts an empty directory instead, the
            # file iam is told to read is then absent, and
            # `EnrolmentConfig::from_env` fails with `UnreadableCa` — a WARN at
            # boot and FAILED_PRECONDITION from IssueEnrolment, with Login and
            # ResolveCredential untouched. Identical to the trade
            # ENROLMENT_GATEWAY already makes above.
            optional: true
            # ONE KEY, not the whole Secret. `gateway-tls` also holds the
            # gateway's PRIVATE KEY, and iam has no business being able to read
            # it. Selecting a single key is what keeps it out of the pod, and it
            # is also what renames cert-manager's `ca.crt` to the `ca.pem` that
            # ENROLMENT_CA_PEM_FILE names.
            #
            # `required` rather than a bare lookup: a values override that nulls
            # the key would render an empty `key:` here, which the API server
            # rejects at sync time with a message about the volume rather than
            # about the value. This names the value instead.
            items:
              - key: {{ required "enrolment.caSecretKey names the key inside enrolment.caSecret that holds the CA and must be set whenever enrolment.caSecret is; see the chart's values.yaml" .Values.enrolment.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
