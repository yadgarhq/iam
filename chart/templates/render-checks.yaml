{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE THIS CHECK READS
THEM (ledger 1135).

`{{- if .Values.autoscaling.enabled }}` BELOW, AND `templates/scaledobject.yaml`'s
own gate, are BARE TRUTHINESS TESTS, which are FAIL-OPEN on a string. Measured on
helm 3.18.4 and 4.3.0, identically:

  false, 0, null, {}, []   render no ScaledObject
  true                     renders one
  "false", "no", "true", 1 render one

So `autoscaling.enabled: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
SCALEDOBJECT. ADR-0797 is the governing rule for this arm: a values key a helm
condition reads, and that this chart DECLARES, is validated with `kindIs "bool"` ON
THE RAW VALUE, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL UP, `autoscaling` ITSELF IS READ AS A BLOCK, NOT A TOGGLE, by both this
check and `templates/scaledobject.yaml`. Measured: a values file setting
`autoscaling: "x"` crashes `templates/scaledobject.yaml` with a raw Go template
error naming no key at all, because `.enabled` cannot be read off a non-map.
ADR-0794 is the governing rule for THIS arm: shape is tested with `kindIs "map"`
ON THE RAW VALUE, `hasKey` first, for the same reason.

ADR-0850 is why BOTH templates need their own copy of this: a `fail` here aborts the
whole render, but which template's unguarded read panics first is not under this
chart's control (measured: `scaledobject.yaml` panics before this file's `fail` is
ever reached), so `templates/scaledobject.yaml` carries its own `kindIs "map"` guard
rather than relying on this one running first.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794) — a refusal and
a raise both exit 1, so the message is the only thing that tells them apart.
`scripts/tests/test_render_checks.py` holds the banned markers in one place and
reads this whole file for them; the nine-shape table beside it is the gate on this
block.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "iam: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "iam: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read from "
      "inside it, and a non-map here crashes the template with a raw Go error naming no key "
      "at all. Write `autoscaling:` as a block, with `enabled: true` or `enabled: false` "
      "inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "iam: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "iam: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "iam.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}

{{/*
ADR-0845's K-1 GUARD: `tls.enabled` RENDERS `LISTEN_TLS_ENABLED` UNCONDITIONALLY,
AND `iamDb.tls.enabled` RENDERS `IAM_DB_TLS_ENABLED` THE SAME WAY (C-SVb).
`templates/deployment.yaml` used to gate each env on bare truthiness — which
rendered no variable at all for null or absence — and now renders
`ternary "1" "0" <key>` unconditionally instead. `ternary` on a non-bool is a
Go type error naming no key at all (measured on helm 4.3.0; re-measured on
3.18.4 — same shape), so the guard below has to run BEFORE that expression
does, in the SAME file this chart already keeps every shape refusal in.

THE SCHEMA PRE-EMPTS THE ABSENT CASE (`tls.required: [enabled]` plus
`tls.enabled.type: boolean`, and the same for `iamDb.tls`) and K-1 accepts
that: `required` alone passes a null value, which is exactly what
`tls: {enabled: null}` and `tls: null` are — Helm deletes a null-valued key
that a chart in the tree declares and restores no default, so `enabled` or
the whole block reaches THIS guard as ABSENT rather than failing the schema.
`tls: {enabled: "true"}` is a third shape the schema's `type: boolean`
already refuses on its own — kept here as a render case too only because
K-1 names it explicitly; the schema is what actually stops it reaching
`ternary`.

ONE SENTENCE PER KEY, NOT PER ARM, because K-1 states the guard this way and
the three non-absent shapes (block non-map, `enabled` absent, `enabled`
non-bool) all mean the same thing to an operator: the leaf is not a bare
`true`/`false`. The sentence names BOTH the chart key and the variable it
renders, which is ADR-0845's own rule for a binary refusal, carried into the
chart's.
*/}}
{{- if not (and (kindIs "map" .Values.tls) (hasKey .Values.tls "enabled") (kindIs "bool" .Values.tls.enabled)) }}
{{- fail "iam: tls.enabled must be set to true or false; it renders LISTEN_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}
{{- if not (and (kindIs "map" .Values.iamDb) (kindIs "map" .Values.iamDb.tls) (hasKey .Values.iamDb.tls "enabled") (kindIs "bool" .Values.iamDb.tls.enabled)) }}
{{- fail "iam: iamDb.tls.enabled must be set to true or false; it renders IAM_DB_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}
{{/* Team access stage 3: `adminFromTeam` renders IAM_ADMIN_FROM_TEAM, which iam
reads as exactly "true" or "false". A string "false" would render a value the
binary refuses at boot, so it is refused here by name (ADR-0797). */}}
{{- if not (and (hasKey .Values "adminFromTeam") (kindIs "bool" .Values.adminFromTeam)) }}
{{- fail "iam: adminFromTeam must be set to true or false; it renders IAM_ADMIN_FROM_TEAM, where is_admin comes from (team access, ADR-0962)" }}
{{- end }}

{{/*
B-N3, THE K-8 CONTRACT FOR THE BROKER HOP (ADR-0852, ADR-0845), the twin of
gateway#105. `nats.tls.enabled` is now REQUIRED with no default, the same
K-1 guard `tls.enabled` and `iamDb.tls.enabled` already carry above: the
schema's `required: [enabled]` plus `type: boolean` pre-empts the absent and
non-bool cases with a null value (K-1's own note on why `required` alone is
not enough), and this guard is what produces ADR-0845's own named sentence
for the two shapes that reach it anyway (a non-map `tls` block, or an
`enabled` that is present but not a bare bool). THE EXPAND'S "true is
refused" LINE IS LIFTED: the binary reads `NATS_TLS_ENABLED` now, and
platform's broker serves TLS from B-L1 — `true` is a real, supported
configuration rather than a chart-only promise.
*/}}
{{- if not (and (kindIs "map" .Values.nats) (kindIs "map" .Values.nats.tls) (hasKey .Values.nats.tls "enabled") (kindIs "bool" .Values.nats.tls.enabled)) }}
{{- fail "iam: nats.tls.enabled must be set to true or false; it renders NATS_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}

{{/*
B-U5, THE CONTRACT HALF OF `tls.clientAuth` (K-8 step 3; ADR-0854, which
extends ADR-0845 to the client-auth mode). The binary adopts
`yadgar_lifecycle::serve_tls` and refuses an absent `LISTEN_TLS_CLIENT_AUTH`
whether TLS is on or off, so this chart has no default for the key and
refuses its absence. `templates/deployment.yaml` renders the variable
UNCONDITIONALLY, outside `tls.enabled`; the CA env, mount and volume stay
under `tls.enabled` and render only when `tls.clientCaSecret` names a Secret.

THE SCHEMA OWNS ONLY ABSENCE (`tls.required`). The leaf carries no `type` or
`enum` (coordinator ruling R1, ADR-0847), so a bare `off`, any other
non-string and an unknown mode all reach THIS file and are refused here by
name. The guard is the K-1 shape — map first, then `hasKey`, then
`kindIs "string"` on the raw value BEFORE any `has`/`ne` (YAML 1.1 reads a
bare `off` as the boolean `false`, and Go's `eq` on a bool and a string is a
type error naming no key) — so the sentence tells the operator to quote it.

THE EXPAND'S "NOT ENFORCED YET" REFUSAL OF `optional` / `required` IS LIFTED:
the binary verifies now. Two refusals replace it, both cross-key, which is
why they are here and not in the schema: a verifying mode with `tls.enabled`
false (a cleartext listener cannot verify a client certificate — the binary
refuses the same shape), and a verifying mode with no `tls.clientCaSecret`
(no authority to verify against, and no `LISTEN_TLS_CLIENT_CA_FILE` to
render). Absent and `""` are the same deployment for the Secret.
*/}}
{{/*
ADR-0975: WITH `tls.enabled` FALSE THIS CHART DOES NOT VALIDATE
`tls.clientAuth`, and `templates/deployment.yaml` renders the CONSTANT "off"
for it. A cleartext listener carries no client certificate, so the binary sees
no name and refuses every RPC (ADR-0972); the binary also refuses any other
value beside a cleartext listener, and refuses it absent, hence the constant.
The D80 all-off render needs this to render. Every check below therefore sits
inside `tls.enabled`.
*/}}
{{- if .Values.tls.enabled }}
{{- if not (and (kindIs "map" .Values.tls) (hasKey .Values.tls "clientAuth") (kindIs "string" .Values.tls.clientAuth)) }}
{{- fail (join "" (list
      "iam: tls.clientAuth must be set to a quoted string, \"off\", \"optional\" or "
      "\"required\"; it renders LISTEN_TLS_CLIENT_AUTH and has no default. YAML reads a "
      "bare off as false: write `clientAuth: \"required\"` (ADR-0854, ADR-0845, ADR-0797)")) }}
{{- end }}
{{- if not (has .Values.tls.clientAuth (list "off" "optional" "required")) }}
{{- fail (printf "iam: tls.clientAuth is %q, which is not off, optional or required." .Values.tls.clientAuth) }}
{{- end }}
{{/*
K1 (ADR-0972, ADR-0975): `"off"` IS REFUSED (TLS IS ON HERE). iam gates every verb on the
caller's certificate name, and `"off"` verifies no caller, so no name reaches
the gate and every RPC is refused at runtime. The refusal moves that outage to
the render. With `tls.enabled` false none of this runs (ADR-0975, see above).
*/}}
{{- if eq .Values.tls.clientAuth "off" }}
{{- fail (join "" (list
      "iam: tls.clientAuth is \"off\", which iam refuses while tls.enabled is true: iam admits a caller by the "
      "name in its client certificate, and \"off\" verifies no certificate, so every RPC would be refused "
      "(ADR-0972). Set tls.clientAuth to \"required\", and name the client CA in "
      "tls.clientCaSecret and tls.clientCaSecretKey.")) }}
{{- end }}
{{- if not .Values.tls.clientCaSecret }}
{{- fail (printf (join "" (list
      "iam: tls.clientAuth is %q but tls.clientCaSecret names no Secret, so there is no "
      "authority to verify a client certificate against. Name the Secret holding the CA "
      "bundle in tls.clientCaSecret; it renders LISTEN_TLS_CLIENT_CA_FILE (ADR-0854)."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- end }}
{{/*
`credential.lifetimeSeconds` (ADR-0972 (3), ledger 1628): REFUSED HERE, BY NAME, EVERY
VALUE THE BINARY REFUSES AT BOOT. It renders CREDENTIAL_LIFETIME_SECONDS, which iam reads
with no default and no "never" value, so a value that rendered and then CrashLooped iam
would stop the authentication plane. The schema leaf is untyped `{}` (ADR-0847) so these
sentences, not helm's, reach the adopter.

WHOLE NUMBER, AND THE KIND MATTERS: a values file delivers 7776000 as float64 and `--set`
as int64, so both kinds are accepted when integral. A string (`--set-string`, a quoted
value) and a bool are refused rather than coerced. The upper bound is IssueCredential's
ten years (`MAX_EXPIRES_IN_SECONDS` in src/service/credential.rs).
*/}}
{{- $credential := .Values.credential }}
{{- if not (and (kindIs "map" $credential) (hasKey $credential "lifetimeSeconds") (not (kindIs "invalid" $credential.lifetimeSeconds))) }}
{{- fail (join "" (list
      "iam: credential.lifetimeSeconds must be set: it renders CREDENTIAL_LIFETIME_SECONDS, which iam "
      "requires to boot, and every Login and RedeemEnrolment credential expires after it (ADR-0972). "
      "The chart default is 7776000 (90 days).")) }}
{{- end }}
{{- $lifetime := $credential.lifetimeSeconds }}
{{- if not (or (kindIs "int" $lifetime) (kindIs "int64" $lifetime) (and (kindIs "float64" $lifetime) (eq $lifetime (floor $lifetime)))) }}
{{- fail (printf (join "" (list
      "iam: credential.lifetimeSeconds is %v (%s), which is not a whole number of seconds. Write an "
      "unquoted integer, for example 7776000 for 90 days (ADR-0972)."))
      $lifetime (kindOf $lifetime)) }}
{{- end }}
{{/*
COMPARED AS float64 AND PRINTED AS GIVEN: `int64` on a float beyond its range wraps, so a
range check after the conversion would report 1e20 as a negative number.
*/}}
{{- if le (float64 $lifetime) 0.0 }}
{{- fail (printf (join "" (list
      "iam: credential.lifetimeSeconds is %v, and a credential lifetime must be positive: there is "
      "no \"never expires\" value (ADR-0972)."))
      $lifetime) }}
{{- end }}
{{- if gt (float64 $lifetime) 315360000.0 }}
{{- fail (printf (join "" (list
      "iam: credential.lifetimeSeconds is %v, longer than the ten years (315360000) iam grants any "
      "credential (ADR-0972)."))
      $lifetime) }}
{{- end }}
{{/*
THE SHAPE OF `server.limits`, AND THE ONE RULE THE SCHEMA CANNOT STATE (ADR-1006;
yaadgaar #218).

`values.schema.json` bounds each of the four limits to the range `yadgar-lifecycle`
enforces, types it `integer` and makes it `required`. Two things it cannot see:

  - `server` or `server.limits` itself, deleted. This chart's `values.yaml` declares
    the block, so an override of `server: null` DELETES it (helm deletes a null-valued
    key a chart in the tree declares and restores no default), and a schema whose every
    constraint sits under `server.limits` has nothing left to check. The ADR-0794 idiom
    (`hasKey`, then `kindIs "map"`) refuses it here with a sentence naming the key,
    before the template reads a leaf of it.
  - A RULE BETWEEN TWO KEYS. `keepaliveTimeoutSeconds` must be strictly below
    `keepaliveIntervalSeconds`, or the next keepalive PING goes out before the last one
    could be judged lost. The binary refuses the same pair at boot
    (`ServerLimitsError::KeepaliveTimeoutNotBelowInterval`); refusing it here means the
    mistake is found at render, before a pod crash-loops on it.

Not counted by `scripts/tests/test_render_checks.py`'s `EXPECTED_RENDER_CHECKS`: that
count is the number of API-group capability checks, and these are value checks like
the `tls.clientAuth` ones above.
*/}}
{{- if not (hasKey .Values "server") }}
{{- fail (join "" (list
      "iam: `server` is absent from the values. It holds `server.limits`, the four "
      "listener limits the binary refuses to boot without (ADR-1006). Helm deletes a "
      "null-valued key that a chart in the tree declares, and restores no default. Write "
      "the keys you mean, or omit `server` entirely and this chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.server) }}
{{- fail (printf (join "" (list
      "iam: `server` must be a map holding `limits` and is %s (%s). Omit it to take this "
      "chart's defaults."))
      (kindOf .Values.server) (toJson .Values.server)) }}
{{- end }}
{{- if not (hasKey .Values.server "limits") }}
{{- fail (join "" (list
      "iam: `server.limits` is absent. The binary refuses to boot without its four "
      "values (ADR-1006). Write the keys you mean, or omit `server` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.server.limits) }}
{{- fail (printf (join "" (list
      "iam: `server.limits` must be a map and is %s (%s). Omit it to take this chart's "
      "defaults."))
      (kindOf .Values.server.limits) (toJson .Values.server.limits)) }}
{{- end }}
{{- if ge (int64 .Values.server.limits.keepaliveTimeoutSeconds) (int64 .Values.server.limits.keepaliveIntervalSeconds) }}
{{- fail (printf (join "" (list
      "iam: `server.limits.keepaliveTimeoutSeconds` (%v) is not below "
      "`server.limits.keepaliveIntervalSeconds` (%v). The next keepalive PING would be sent "
      "before the last one could be judged lost, and iam refuses to boot this way "
      "(ADR-1006). Lower the timeout or raise the interval."))
      .Values.server.limits.keepaliveTimeoutSeconds .Values.server.limits.keepaliveIntervalSeconds) }}
{{- end }}
{{/* ADR-1085: `keyIdentity.adopt` renders KEY_IDENTITY_ADOPT, which iam reads as
exactly "observe" or "adopt". `values.yaml` defaults it to "observe"; this refuses
every other shape and spelling by name, a deleted key (`adopt: null`) included
(ADR-0797). */}}
{{- $adopt := dig "adopt" nil (ternary .Values.keyIdentity dict (kindIs "map" .Values.keyIdentity)) }}
{{- if not (and (kindIs "string" $adopt) (has $adopt (list "observe" "adopt"))) }}
{{- fail "iam: keyIdentity.adopt must be set to \"observe\" or \"adopt\"; it renders KEY_IDENTITY_ADOPT, what a passed key-identity adoption proof may do (ADR-1085)" }}
{{- end }}
{{/*
EVERY NUMERIC KNOB THIS CHART RENDERS IS A WHOLE NUMBER, OR THE RENDER REFUSES NAMING THE
KEY (yaadgaar 482, 485).

A values FILE decodes a number as float64, and `quote` prints a float64 with `%v`, so
1000000 renders "1e+06" and 2147483648 renders "2.147483648e+09": the binary parses
neither. The rendering sites below therefore cast with `int64`. `int64` is silent on a
value that does not fit (a 20-digit string becomes 0, 1e20 becomes
-9223372036854775808) and parses a string base 0 (`0123` is 83, `08` is 0), so the cast
is never the check. Measured on helm 4.3.0. This block is the check, and it runs BEFORE
the cast: a string is at most 18 digits with no leading zero, and a number is whole and
below 1e18. A string of digits stays valid (`--set-string replicaCount=2`
is accepted by design, ADR-0847), and so does any non-negative whole number in range.

Three bounds ride on the same loop. A port is refused below 1 (port 0 listens on
nothing) and above 65535, the largest TCP port. A replica count is refused above
2147483647, the int32 field Kubernetes stores it in. ZERO IS NOT REFUSED FOR `replicaCount`: `replicaCount` 0 stays legal while autoscaling is off (scale to zero, ruled 2026-11-03). `autoscaling.minReplicas` below 2 is refused while autoscaling is on (D55, yaadgaar 482), by the block at the end of this file.

ONLY A KNOB THE RENDER READS IS CHECKED. `replicaCount` feeds `replicas:` only while `autoscaling.enabled` is false, and `autoscaling.minReplicas`
and `maxReplicas` feed the ScaledObject only while it is true,
so a bad value in the arm that is off changes nothing and is not refused.
`minReadySeconds`, `terminationGracePeriodSeconds` and `preStopSleepSeconds` sit behind `with`, which skips
nil and the NUMBER 0 and so are checked only when present. `with` PASSES THE STRING "0": every
non-empty string is true to a Go template, so `--set-string terminationGracePeriodSeconds=0` used
to render `terminationGracePeriodSeconds: 0`, an immediate SIGKILL. For these three keys the string
"0" is therefore refused by name, after the whole-number check (yaadgaar 639). It is the one
carve-out from ADR-0847. Today the regex admits no other string whose `int64` is 0 ("00", " 0",
"0.0" and "-0" are already refused as not whole), but the refusal compares `int64 $value` with 0
and not the text with "0", so a loosened regex that admits "00" still has "00" refused (yaadgaar
641). Such a regex would also have "08" refused here, because `int64` reads a string it cannot
parse as 0: that fails closed. `terminationGracePeriodSeconds`, `preStopSleepSeconds` and `topologySpread.maxSkew` are cast like the rest (yaadgaar 550): `hooks/chart_baseline.py` reads `{{ . | int64 }}` since yadgarhq/actions v1.64.0. All three stay bounded at 999999, the largest value a float64 prints without an exponent. The gate no longer forces that bound, and lifting it is a separate decision. `topologySpread.maxSkew` is also refused below 1 (the API requires it greater than zero) and is read only while `topologySpread.enabled` is true. The other knobs are rendered
unconditionally, so a missing key reads as nil here and is refused too.
`autoscaling.enabled` is a confirmed bool by the blocks above.
*/}}
{{- $checks := list
      (dict "key" "iamDb.port" "value" .Values.iamDb.port "min" 1 "max" 65535)
      (dict "key" "login.responseFloorMs" "value" .Values.login.responseFloorMs)
      (dict "key" "redeemEnrolment.responseFloorMs" "value" .Values.redeemEnrolment.responseFloorMs) }}
{{- if .Values.autoscaling.enabled }}
{{- $checks = append $checks (dict "key" "autoscaling.minReplicas" "value" .Values.autoscaling.minReplicas "max" 2147483647) }}
{{- $checks = append $checks (dict "key" "autoscaling.maxReplicas" "value" .Values.autoscaling.maxReplicas "max" 2147483647) }}
{{- else }}
{{- $checks = append $checks (dict "key" "replicaCount" "value" .Values.replicaCount "max" 2147483647) }}
{{- end }}
{{- if and (hasKey .Values "minReadySeconds") (not (kindIs "invalid" .Values.minReadySeconds)) }}
{{- $checks = append $checks (dict "key" "minReadySeconds" "value" .Values.minReadySeconds "refuseZeroString" true) }}
{{- end }}
{{- if and (hasKey .Values "terminationGracePeriodSeconds") (not (kindIs "invalid" .Values.terminationGracePeriodSeconds)) }}
{{- $checks = append $checks (dict "key" "terminationGracePeriodSeconds" "value" .Values.terminationGracePeriodSeconds "max" 999999 "refuseZeroString" true) }}
{{- end }}
{{- if and (hasKey .Values "preStopSleepSeconds") (not (kindIs "invalid" .Values.preStopSleepSeconds)) }}
{{- $checks = append $checks (dict "key" "preStopSleepSeconds" "value" .Values.preStopSleepSeconds "max" 999999 "refuseZeroString" true) }}
{{- end }}
{{- if and (kindIs "map" .Values.topologySpread) .Values.topologySpread.enabled }}
{{- $checks = append $checks (dict "key" "topologySpread.maxSkew" "value" .Values.topologySpread.maxSkew "min" 1 "max" 999999) }}
{{- end }}
{{- range $check := $checks }}
{{- $value := $check.value }}
{{- $whole := false }}
{{- if kindIs "string" $value }}
{{- $whole = regexMatch "^(0|[1-9][0-9]{0,17})$" $value }}
{{- else if or (kindIs "float64" $value) (kindIs "int64" $value) (kindIs "int" $value) }}
{{- $whole = and (ge (float64 $value) 0.0) (lt (float64 $value) 1.0e18) (eq (float64 $value) (floor (float64 $value))) }}
{{- end }}
{{- if not $whole }}
{{- fail (printf "iam: `%s` must be a whole number of at least 0 and is %s. It is rendered through `int64`, which turns a fraction, an out-of-range value or a string with a leading zero into a different number without saying so. Write digits only, for example `30`." $check.key (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "refuseZeroString") (kindIs "string" $value) (eq (int64 $value) 0) }}
{{- fail (printf "iam: `%s` is the string %s, which a `with` guard treats as set, so it would render as 0 and not as the API default. Write the number 0 (`--set`, not `--set-string`) or delete the key to leave the field unset (yaadgaar 639)." $check.key (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "min") (lt (int64 $value) (int64 $check.min)) }}
{{- fail (printf "iam: `%s` must be at least %d and is %s." $check.key (int64 $check.min) (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "max") (gt (int64 $value) (int64 $check.max)) }}
{{- fail (printf "iam: `%s` must be at most %d and is %s." $check.key (int64 $check.max) (toJson $value)) }}
{{- end }}
{{- end }}
{{- /*
AUTOSCALING FLOOR, D55 (yaadgaar 482, ruled 2026-11-03). `autoscaling.minReplicas` feeds KEDA's
`minReplicaCount`, and D55 makes at least two pods a correctness property, not a tuning choice.
Refused below 2 while `autoscaling.enabled` is true. Placed after the whole-number check above, so
`int64` reads a confirmed whole number; `autoscaling.enabled` is a confirmed bool by the shape blocks.
While autoscaling is off the knob is not read, and `replicaCount: 0` stays legal (scale to zero).
*/}}
{{- if .Values.autoscaling.enabled }}
{{- if lt (int64 .Values.autoscaling.minReplicas) 2 }}
{{- fail (printf (join "" (list
      "iam: `autoscaling.minReplicas` must be at least 2 while `autoscaling.enabled` is true, and is %s. "
      "It renders as the ScaledObject's `minReplicaCount`, and below 2 the service can run on one pod or "
      "none, which D55 forbids. Write 2 or more, or set `autoscaling.enabled: false`."))
      (toJson .Values.autoscaling.minReplicas)) }}
{{- end }}
{{- end }}
