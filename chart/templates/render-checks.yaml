{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE THIS CHECK READS
THEM (ledger 1135).

`{{- if .Values.autoscaling.enabled }}` BELOW, AND `templates/scaledobject.yaml`'s
own gate, are BARE TRUTHINESS TESTS, which are FAIL-OPEN on a string. Measured on
helm 3.18.4 and 4.3.0, identically:

  false, 0, null, {}, []   render no ScaledObject
  true                     renders one
  "false", "no", "true", 1 render one

So `autoscaling.enabled: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
SCALEDOBJECT. ADR-0797 is the governing rule for this arm: a values key a helm
condition reads, and that this chart DECLARES, is validated with `kindIs "bool"` ON
THE RAW VALUE, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL UP, `autoscaling` ITSELF IS READ AS A BLOCK, NOT A TOGGLE, by both this
check and `templates/scaledobject.yaml`. Measured: a values file setting
`autoscaling: "x"` crashes `templates/scaledobject.yaml` with a raw Go template
error naming no key at all, because `.enabled` cannot be read off a non-map.
ADR-0794 is the governing rule for THIS arm: shape is tested with `kindIs "map"`
ON THE RAW VALUE, `hasKey` first, for the same reason.

ADR-0850 is why BOTH templates need their own copy of this: a `fail` here aborts the
whole render, but which template's unguarded read panics first is not under this
chart's control (measured: `scaledobject.yaml` panics before this file's `fail` is
ever reached), so `templates/scaledobject.yaml` carries its own `kindIs "map"` guard
rather than relying on this one running first.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794) — a refusal and
a raise both exit 1, so the message is the only thing that tells them apart.
`scripts/tests/test_render_checks.py` holds the banned markers in one place and
reads this whole file for them; the nine-shape table beside it is the gate on this
block.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "iam: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "iam: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read from "
      "inside it, and a non-map here crashes the template with a raw Go error naming no key "
      "at all. Write `autoscaling:` as a block, with `enabled: true` or `enabled: false` "
      "inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "iam: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "iam: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "iam.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}

{{/*
ADR-0845's K-1 GUARD: `tls.enabled` RENDERS `LISTEN_TLS_ENABLED` UNCONDITIONALLY,
AND `iamDb.tls.enabled` RENDERS `IAM_DB_TLS_ENABLED` THE SAME WAY (C-SVb).
`templates/deployment.yaml` used to gate each env on bare truthiness — which
rendered no variable at all for null or absence — and now renders
`ternary "1" "0" <key>` unconditionally instead. `ternary` on a non-bool is a
Go type error naming no key at all (measured on helm 4.3.0; re-measured on
3.18.4 — same shape), so the guard below has to run BEFORE that expression
does, in the SAME file this chart already keeps every shape refusal in.

THE SCHEMA PRE-EMPTS THE ABSENT CASE (`tls.required: [enabled]` plus
`tls.enabled.type: boolean`, and the same for `iamDb.tls`) and K-1 accepts
that: `required` alone passes a null value, which is exactly what
`tls: {enabled: null}` and `tls: null` are — Helm deletes a null-valued key
that a chart in the tree declares and restores no default, so `enabled` or
the whole block reaches THIS guard as ABSENT rather than failing the schema.
`tls: {enabled: "true"}` is a third shape the schema's `type: boolean`
already refuses on its own — kept here as a render case too only because
K-1 names it explicitly; the schema is what actually stops it reaching
`ternary`.

ONE SENTENCE PER KEY, NOT PER ARM, because K-1 states the guard this way and
the three non-absent shapes (block non-map, `enabled` absent, `enabled`
non-bool) all mean the same thing to an operator: the leaf is not a bare
`true`/`false`. The sentence names BOTH the chart key and the variable it
renders, which is ADR-0845's own rule for a binary refusal, carried into the
chart's.
*/}}
{{- if not (and (kindIs "map" .Values.tls) (hasKey .Values.tls "enabled") (kindIs "bool" .Values.tls.enabled)) }}
{{- fail "iam: tls.enabled must be set to true or false; it renders LISTEN_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}
{{- if not (and (kindIs "map" .Values.iamDb) (kindIs "map" .Values.iamDb.tls) (hasKey .Values.iamDb.tls "enabled") (kindIs "bool" .Values.iamDb.tls.enabled)) }}
{{- fail "iam: iamDb.tls.enabled must be set to true or false; it renders IAM_DB_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}

{{/*
B-N3E, THE K-8 EXPAND FOR THE BROKER HOP (ADR-0852), the twin of gateway#104.
`nats.tls.enabled` is OPTIONAL in this chart version: absent renders nothing,
so every values file written before this key existed renders as it did.
PRESENCE IS `enabled`, never the `tls` map, so a `tls: {}` (or, from B-N3, a
map holding only CA keys) does not state the switch. Present, it is validated
here (the same map / `hasKey` / `kindIs "bool"` shape as the guards above; the
schema's `type: boolean` refuses a null or a string first), and `true` is
refused: the binary reads `NATS_TLS_ENABLED` only from B-N3 and the broker
serves no TLS until B-L1. B-N3 makes the key required and lifts the `true`
refusal. `templates/deployment.yaml` renders the variable under the same
map-and-`hasKey` test (a template variable does not cross files).
*/}}
{{- $natsTlsStated := and (kindIs "map" .Values.nats.tls) (hasKey .Values.nats.tls "enabled") -}}
{{- if and $natsTlsStated (not (kindIs "bool" .Values.nats.tls.enabled)) }}{{ fail "iam: nats.tls.enabled must be true or false when it is set; it renders NATS_TLS_ENABLED (ADR-0845, ADR-0797)" }}{{ end }}
{{- if and $natsTlsStated (kindIs "bool" .Values.nats.tls.enabled) .Values.nats.tls.enabled }}{{ fail "iam: nats.tls.enabled: true is refused by this chart version: it declares the key, but the binary reads NATS_TLS_ENABLED only from B-N3 and the broker serves no TLS until B-L1. Set it to false (ADR-0845, ADR-0852)" }}{{ end }}

{{/*
B-U5, THE CONTRACT HALF OF `tls.clientAuth` (K-8 step 3; ADR-0854, which
extends ADR-0845 to the client-auth mode). The binary adopts
`yadgar_lifecycle::serve_tls` and refuses an absent `LISTEN_TLS_CLIENT_AUTH`
whether TLS is on or off, so this chart has no default for the key and
refuses its absence. `templates/deployment.yaml` renders the variable
UNCONDITIONALLY, outside `tls.enabled`; the CA env, mount and volume stay
under `tls.enabled` and render only when `tls.clientCaSecret` names a Secret.

THE SCHEMA REFUSES FIRST (`type: string`, the three-value `enum`, and
`tls.required`): an absent key, a bare `off` and an unknown mode never reach
this file. The guard below is the K-1 shape kept anyway — map first, then
`hasKey`, then `kindIs "string"` on the raw value BEFORE any `has`/`ne`
(YAML 1.1 reads a bare `off` as the boolean `false`, and Go's `eq` on a bool
and a string is a type error naming no key) — so the sentence an operator
reads names the key and the variable even if a schema is not in the path.

THE EXPAND'S "NOT ENFORCED YET" REFUSAL OF `optional` / `required` IS LIFTED:
the binary verifies now. Two refusals replace it, both cross-key, which is
why they are here and not in the schema: a verifying mode with `tls.enabled`
false (a cleartext listener cannot verify a client certificate — the binary
refuses the same shape), and a verifying mode with no `tls.clientCaSecret`
(no authority to verify against, and no `LISTEN_TLS_CLIENT_CA_FILE` to
render). Absent and `""` are the same deployment for the Secret.
*/}}
{{- if not (and (kindIs "map" .Values.tls) (hasKey .Values.tls "clientAuth") (kindIs "string" .Values.tls.clientAuth)) }}
{{- fail (join "" (list
      "iam: tls.clientAuth must be set to a quoted string, \"off\", \"optional\" or "
      "\"required\"; it renders LISTEN_TLS_CLIENT_AUTH and has no default. YAML reads a "
      "bare off as false: write `clientAuth: \"off\"` (ADR-0854, ADR-0845, ADR-0797)")) }}
{{- end }}
{{- if not (has .Values.tls.clientAuth (list "off" "optional" "required")) }}
{{- fail (printf "iam: tls.clientAuth is %q, which is not off, optional or required." .Values.tls.clientAuth) }}
{{- end }}
{{- if and (ne .Values.tls.clientAuth "off") (not .Values.tls.enabled) }}
{{- fail (printf (join "" (list
      "iam: tls.clientAuth is %q but tls.enabled is false: a cleartext listener cannot "
      "verify a client certificate. Set tls.enabled to true, or tls.clientAuth to \"off\" "
      "(ADR-0854)."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- if and (ne .Values.tls.clientAuth "off") (not .Values.tls.clientCaSecret) }}
{{- fail (printf (join "" (list
      "iam: tls.clientAuth is %q but tls.clientCaSecret names no Secret, so there is no "
      "authority to verify a client certificate against. Name the Secret holding the CA "
      "bundle in tls.clientCaSecret; it renders LISTEN_TLS_CLIENT_CA_FILE (ADR-0854)."))
      .Values.tls.clientAuth) }}
{{- end }}
