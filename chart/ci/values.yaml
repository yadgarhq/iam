# WHAT THIS CHART'S OWN CI RENDERS AGAINST, bare — no parent, no subchart.
#
# ADR-0845 (C-SVb) drops `tls.enabled`'s and `iamDb.tls.enabled`'s chart
# defaults and makes both `required` (`chart/values.schema.json`), so a bare
# `helm lint --strict chart` and a bare `helm template` both refuse the
# moment that lands, with nothing in THIS repository's own diff to explain
# why: the shared `helm-lint` hook (`yadgarhq/actions` C-A2) and
# `scripts/tests/*.py` render this chart alone, with no parent values to
# fall back on.
#
# `yadgarhq/actions`'s `chart_values_override.py` passes this file with `-f`
# to both `helm lint --strict` and `helm template` whenever it exists — the
# same backward-compatible convention `chart/ci/api-versions.txt` would use
# for `--api-versions`, had this chart needed one. A chart with no such file
# sees no difference; this one now needs it, the same reason
# `yadgarhq/chart`'s own `chart/ci/values.yaml` exists at the parent level.
#
# `scripts/tests/test_values_schema.py` and
# `scripts/tests/test_render_checks.py` pass this same file to every bare
# `helm template`/`helm lint` they run, so the suite and the hook measure one
# chart rather than two.
#
# `tls.clientAuth` (B-U5, ADR-0854; K-8 step 3) has no default either, and is
# stated at `"off"` — the value the parent fixture (B-P1) states for every
# server — QUOTED, because YAML reads a bare off as false.
tls:
  enabled: true
  clientAuth: "off"
iamDb:
  tls:
    enabled: true

# B-N3 (K-8 contract, ADR-0852, ADR-0845): the broker hop's switch, now
# required with no default, the same shape as `tls.enabled`/`iamDb.tls.enabled`
# above. Stated `false` — unchanged from the B-N3E expand — because platform's
# broker does not serve TLS until B-L1; `true` is accepted by this chart
# version but would be a real cleartext-dial refusal against today's broker.
nats:
  tls:
    enabled: false
