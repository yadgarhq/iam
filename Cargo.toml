[package]
name = "yadgar-iam"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The identity module's logic service: business rules, no store."

[dependencies]
# NO sqlx, NO yadgar-store, and that absence is the design (D4). A logic service
# reaches its data only over the -db API — here, IamDbService — and a store SDK
# in this dependency tree would mean it could open its own connection, which is
# what the twin exists to prevent. proto-contract-design keeps a per-repo check
# for exactly this.
#
# `tls-ring` is DECLARED HERE rather than inherited. `yadgar-dial` enables it and
# feature unification would hand it to this crate anyway, but a feature this
# crate's own `serve::builder` calls into is one this crate must ask for: the day
# the dial dependency changes, an implicit feature disappears with it and the
# error lands on a line nobody edited. `tls-ring` rather than `tls-aws-lc` for
# the reason dial gives — aws-lc-rs needs cmake and a C toolchain, and this
# builds for x86_64-unknown-linux-musl (D63).
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "router",
  "server",
  "transport",
  "channel",
  "tls-ring",
] }
tonic-prost = "0.14"
# The SAME PEM parser tonic itself uses on the certificate and the key, so "this
# file holds no certificate" is decided in `serve.rs` rather than failing
# opaquely inside the acceptor. Present in the tree already by way of
# tokio-rustls; naming it directly costs nothing and is what lets the error say
# WHICH of the two files an operator has to fix. It is the same reasoning, and
# the same crate, that `yadgar_dial::TlsOptions::prepare` uses on a CA bundle.
rustls-pki-types = { version = "1", features = ["std"] }
# How this process starts, stops and restarts: ADR-0523's exit-on-change rotation
# watcher, the SIGTERM drain, and the budget that bounds it. This repository held
# the ORIGINAL of the watcher and `task` and `gateway` each carried a copy; the
# X.509 parser that read a leaf's `notAfter` and the metrics facade that gauges it
# are ITS dependencies now, so both are gone from here. `rustls-pki-types` stays,
# because `serve` decodes a certificate and a key of its own.
#
# Pinned by a published tag per ADR-0526, like every other in-org crate.
yadgar-lifecycle = { git = "https://github.com/yadgarhq/lifecycle.git", tag = "v0.1.2" }
# Pinned by RELEASE TAG. A published tag never moves in this organisation — a
# correction is a new tag — and Cargo.lock records the revision it resolved to,
# so the pin is as exact as the revision it replaces.
yadgar-dial = { git = "https://github.com/yadgarhq/dial.git", tag = "v0.2.0" }

# The shared instrumentation seam (D67). Pinned by release tag, like every other
# in-org crate — a branch is a moving target, a published tag is not.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", tag = "v0.1.0", features = ["grpc"] }
prost = "0.14"
prost-types = "0.14"
# `signal` for `serve::shutdown`; `sync` for the oneshot that carries the
# shutdown REQUEST to the spawned server, which is what lets the drain budget's
# clock start when shutdown is asked for rather than when the server started;
# `time` for `tokio::time::sleep` in `rotate` and `tokio::time::timeout` around
# the drain.
#
# `time` IS NAMED RATHER THAN INHERITED, and that is the same discipline
# `tls-ring` above is declared under. A transitive dependency enables it today,
# so this crate compiles without asking; the day that dependency changes, the
# feature disappears and the error lands on a line nobody edited.
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
http = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# The identity module's own primitives (D72): encrypting personal data at rest,
# hashing passwords, computing blind indexes and token hashes. None of this
# touches storage — iam-db holds ciphertext and hashes only, and every one of
# these operations happens here before a value crosses that boundary.
# The 0.10 / 0.5 / 0.12 / 0.10 line, NOT the newest majors, and deliberately.
# aes-gcm 0.11 replaces `Aead` with a buffer-based `AeadInOut`, and argon2 0.6
# moves salt generation inside `hash_password` — both are real API rewrites. This
# is the line the ecosystem actually runs and the one whose usage is
# well-established; writing cryptographic code against an API being guessed at is
# the worst place in the system to be approximately right. Revisit deliberately,
# not by autoupdate.
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
base64 = "0.22"
async-nats = "0.50"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`. The response-time floor
# has one property no wall-clock assertion can pin — that the deadline is
# ANCHORED to the start of the call rather than ADDED to the work it did — and a
# paused clock is what turns that into an equality instead of a bound. Dev-only,
# so the deployed binary never links the time-manipulation machinery.
#
# `net` and `time` for the TLS rig in tests/serve_tls.rs: it binds its own
# listeners and waits for the port rather than sleeping a guessed interval.
#
# `io-util` for the fake broker in tests/nats_auth.rs, which reads the CONNECT
# line off the socket to assert what actually went on the wire. Named here rather
# than relied on: async-nats enables it too, so feature unification would supply
# it today, and a dependency that moved would take these tests with it.
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "test-util",
  "net",
  "time",
  "io-util",
] }
# Certificates are MINTED PER TEST RUN rather than checked in: a fixture key in
# the repository is a secret in the repository, and it expires on a date nobody
# is watching.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# `with_local_recorder`, beside `metrics-util`'s `DebuggingRecorder`. The FACADE
# only, and a dev-dependency now — the binary installs the exporter and
# `yadgar-lifecycle` owns the gauge; what `tests/assembly.rs` asserts is the
# `service` label a dashboard selects THIS service on.
metrics = "0.24"
# `DebuggingRecorder` + `with_local_recorder`: the only way to assert that the
# metric NAME a dashboard queries, and the LABEL it carries, are what this crate
# claims — a typo in either compiles, passes clippy, and produces a series
# nothing queries. MUST resolve against `metrics 0.24`: a metrics-util built on
# another major links a SECOND facade, and then the snapshot is empty while every
# assertion still passes vacuously. `yadgar-telemetry` pairs the same two
# versions for the same reason.
metrics-util = { version = "0.20", features = ["debugging"] }
# Wraps a `TcpListener` the rig owns into the stream `serve_with_incoming` takes,
# which is how the same builder the binary uses gets served on a port the test
# chose. Dev-only, so the shipped tree is unchanged.
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
